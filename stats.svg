<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260">
<defs>
<linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0e0318"/><stop offset="100%" stop-color="#1a0530"/>
</linearGradient>
<linearGradient id="ringGradS" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ff3d94"><animate attributeName="stop-color" values="#ff3d94;#a020f0;#c026d3;#ff3d94" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#a020f0"><animate attributeName="stop-color" values="#a020f0;#c026d3;#ff3d94;#a020f0" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="1" y="1" width="478" height="258" rx="18" fill="url(#cardBg)" stroke="#4a1568"/>
<text x="24" y="34" font-family="Segoe UI,sans-serif" font-weight="700" font-size="16" fill="#f3e8ff" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.1s" fill="freeze"/>GitHub Stats</text>

<g transform="translate(362,130.0)">
  <circle r="46" fill="none" stroke="#170225" stroke-width="10"/>
  <circle r="46" fill="none" stroke="url(#ringGradS)" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="289.0" stroke-dashoffset="289.0" transform="rotate(-90)" filter="url(#glowS)">
    <animate attributeName="stroke-dashoffset" from="289.0" to="40.5" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
  </circle>
  <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="800" font-size="26" fill="#f3e8ff" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>A+</text>
  <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#c9a6e8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>RANK</text>
</g>

<g transform="translate(24,44)">
        <g transform="translate(-40,58)" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="-40,58;0,58" dur="0.5s" begin="0.50s" fill="freeze"/>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.50s" fill="freeze"/>
          <circle cx="6" cy="-5" r="4" fill="#ff3d94"/>
          <text x="18" y="0" font-family="Segoe UI,sans-serif" font-size="13.5" fill="#c9a6e8">Total Stars</text>
          <text x="230" y="0" text-anchor="end" font-family="'Courier New',monospace" font-weight="700" font-size="15" fill="#ff3d94">1.2k</text>
        </g>

        <g transform="translate(-40,88)" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="-40,88;0,88" dur="0.5s" begin="0.68s" fill="freeze"/>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.68s" fill="freeze"/>
          <circle cx="6" cy="-5" r="4" fill="#a020f0"/>
          <text x="18" y="0" font-family="Segoe UI,sans-serif" font-size="13.5" fill="#c9a6e8">Total Commits</text>
          <text x="230" y="0" text-anchor="end" font-family="'Courier New',monospace" font-weight="700" font-size="15" fill="#a020f0">3,480</text>
        </g>

        <g transform="translate(-40,118)" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="-40,118;0,118" dur="0.5s" begin="0.86s" fill="freeze"/>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.86s" fill="freeze"/>
          <circle cx="6" cy="-5" r="4" fill="#c026d3"/>
          <text x="18" y="0" font-family="Segoe UI,sans-serif" font-size="13.5" fill="#c9a6e8">PRs Merged</text>
          <text x="230" y="0" text-anchor="end" font-family="'Courier New',monospace" font-weight="700" font-size="15" fill="#c026d3">62</text>
        </g>

        <g transform="translate(-40,148)" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="-40,148;0,148" dur="0.5s" begin="1.04s" fill="freeze"/>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.04s" fill="freeze"/>
          <circle cx="6" cy="-5" r="4" fill="#5eead4"/>
          <text x="18" y="0" font-family="Segoe UI,sans-serif" font-size="13.5" fill="#c9a6e8">Repositories</text>
          <text x="230" y="0" text-anchor="end" font-family="'Courier New',monospace" font-weight="700" font-size="15" fill="#5eead4">38</text>
        </g></g>
</svg>