<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
<defs>
<linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0e0318"/><stop offset="100%" stop-color="#1a0530"/>
</linearGradient>
<linearGradient id="ringGradS" x1="0%" y1="0%" x2="100%" y2="100%">
