name: Generate Contribution Snake

on:
  schedule:
    # runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate custom pink/purple contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NIRAJRATHOD19
          outputs: |
            dist/github-snake.svg?color_snake=%23ff3d94&color_dots=%23170225,%23f0abfc,%23c026d3,%23a020f0,%237b2ff7
            dist/github-snake-dark.svg?color_snake=%23ff3d94&color_dots=%230e0318,%23f0abfc,%23c026d3,%23a020f0,%237b2ff7

      # publishes the content of dist/ to the "output" branch, so the SVGs can be
      # embedded directly via raw.githubusercontent.com in README.md
      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
